name: Install pinned APT tooling
description: Install checksum-verified reprepro with multiple-version support on Ubuntu 26.04.
runs:
  using: composite
  steps:
    - name: Download and install reprepro
      shell: bash
      run: |
        REPREPRO_DEB="$(mktemp --suffix=.deb)"
        trap 'rm -f "$REPREPRO_DEB"' EXIT
        curl --fail --show-error --location \
          --proto '=https' --proto-redir '=https' \
          --connect-timeout 10 --max-time 60 \
          --retry 3 --retry-max-time 120 \
          --output "$REPREPRO_DEB" \
          https://deb.debian.org/debian/pool/main/r/reprepro/reprepro_5.5.1-1_amd64.deb
        echo "4345c803b84796eac3ac802bee982049fa85a4d3c590cbf24c3e408543b01dcc  $REPREPRO_DEB" | sha256sum --check -

        sudo apt-get update
        sudo apt-get install --yes apt-mirror apt-transport-https "$REPREPRO_DEB"
        reprepro --version
