name: Bump version and release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attest
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'push' && !github.event.act }} # skip during local actions testing and manual attestation
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.publish.outputs.released }}
      new_tag: ${{ steps.plan.outputs.new_tag }}
    permissions:
      contents: read
    steps:
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go install binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bin-${{ hashFiles('justfile', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-bin-

      - name: Plan release
        id: plan
        run: |
          go run ./cmd/release-plan \
            --repository "$GITHUB_REPOSITORY" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build release artifacts
        if: ${{ steps.plan.outputs.release_needed == 'true' }}
        env:
          VERSION: ${{ steps.plan.outputs.new_tag }}
        run: just release

      - name: Create release token
        if: ${{ steps.plan.outputs.release_needed == 'true' }}
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: hotaisle-cli
          permission-contents: write

      - name: Publish tag, artifacts, and GitHub release
        if: ${{ steps.plan.outputs.release_needed == 'true' }}
        id: publish
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          NEW_TAG: ${{ steps.plan.outputs.new_tag }}
          RELEASE_SHA: ${{ steps.plan.outputs.commit }}
        run: |
          gh release create "$NEW_TAG" dist/*.tar.gz dist/*.zip dist-pkg/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "$NEW_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Create Homebrew repository token
        if: ${{ steps.publish.outputs.released == 'true' }}
        id: homebrew-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Checkout Homebrew tap
        if: ${{ steps.publish.outputs.released == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hotaisle/homebrew-tap
          path: homebrew-tap
          token: ${{ steps.homebrew-token.outputs.token }}
          persist-credentials: false

      - name: Generate Homebrew formula
        if: ${{ steps.publish.outputs.released == 'true' }}
        env:
          NEW_TAG: ${{ steps.plan.outputs.new_tag }}
        run: |
          VERSION="$NEW_TAG" just brew-formula > homebrew-tap/Formula/hotaisle.rb

      - name: Push formula to Homebrew tap
        if: ${{ steps.publish.outputs.released == 'true' }}
        env:
          NEW_TAG: ${{ steps.plan.outputs.new_tag }}
          REPO_TOKEN: ${{ steps.homebrew-token.outputs.token }}
        run: |
          cd homebrew-tap

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Formula/hotaisle.rb
          git commit -m "Update formula for $NEW_TAG"
          git push "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" HEAD:main

      - name: Create APT repository token
        if: ${{ steps.publish.outputs.released == 'true' }}
        id: apt-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: apt-repo
          permission-contents: write

      - name: Checkout APT repository
        if: ${{ steps.publish.outputs.released == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hotaisle/apt-repo
          path: apt-repo
          token: ${{ steps.apt-token.outputs.token }}
          persist-credentials: false

      - name: Copy packages to APT repository directory
        if: ${{ steps.publish.outputs.released == 'true' }}
        run: |
          mkdir -p dist-deb
          cp dist-pkg/*.deb dist-deb

      - name: Checkout pinned APT repository builder
        if: ${{ steps.publish.outputs.released == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: morph027/apt-repo-action
          ref: b6b977523e6a5e235075787489bb073c60b71eb4 # v3.8
          path: .apt-repo-action
          persist-credentials: false

      - name: Install pinned APT repository tooling
        if: ${{ steps.publish.outputs.released == 'true' }}
        run: |
          REPREPRO_DEB=/tmp/reprepro_5.5.1-1_amd64.deb
          wget --quiet --https-only \
            --output-document="$REPREPRO_DEB" \
            https://packaging.gitlab.io/reprepro-multiple-versions/pool/main/r/reprepro/reprepro_5.5.1-1_amd64.deb
          echo "acabb921525769c19dfa1a43552a0fa756aa6c6e10d377c9dfb54bdb341ba0ad  $REPREPRO_DEB" | sha256sum --check -

          sudo apt-get update
          sudo apt-get install --yes apt-mirror apt-transport-https "$REPREPRO_DEB"
          install -m 0755 "$(go env GOPATH)/bin/nfpm" /tmp/nfpm

      - name: Import existing APT packages
        if: ${{ steps.publish.outputs.released == 'true' }}
        working-directory: dist-deb
        env:
          IMPORT_FROM_REPO: |
            deb-amd64 https://hotaisle.github.io/apt-repo stable main
            deb-arm64 https://hotaisle.github.io/apt-repo stable main
            deb-armhf https://hotaisle.github.io/apt-repo stable main
          IMPORT_FROM_REPO_FAILURE_ALLOW: "true"
        run: ../.apt-repo-action/import.sh

      - name: Create APT repository
        if: ${{ steps.publish.outputs.released == 'true' }}
        id: create-apt-repo
        env:
          REPO_NAME: apt-repo
          SIGNING_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          SCAN_DIR: dist-deb
          LIMIT: 10
          CODENAME: stable
          COMPONENTS: main
          ARCHITECTURES: amd64 arm64 armhf
        run: .apt-repo-action/repo.sh

      - name: Push to APT repository
        if: ${{ steps.publish.outputs.released == 'true' }}
        env:
          NEW_TAG: ${{ steps.plan.outputs.new_tag }}
          REPO_TOKEN: ${{ steps.apt-token.outputs.token }}
          APT_REPO_DIR: ${{ steps.create-apt-repo.outputs.dir }}
        run: |
          ls -lah "$APT_REPO_DIR"
          cp -r "$APT_REPO_DIR"/. apt-repo/

          cd apt-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Add packages from $NEW_TAG" || echo "No changes to commit"
          git push "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/apt-repo.git" HEAD:main

      - name: Create RPM repository token
        if: ${{ steps.publish.outputs.released == 'true' }}
        id: rpm-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: rpm-repo
          permission-contents: write

      - name: Checkout RPM repository
        if: ${{ steps.publish.outputs.released == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hotaisle/rpm-repo
          path: rpm-repo
          token: ${{ steps.rpm-token.outputs.token }}
          persist-credentials: false

      - name: Create RPM repository
        if: ${{ steps.publish.outputs.released == 'true' }}
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c

          mkdir -p rpm-repo/packages
          cp dist-pkg/*.rpm rpm-repo/packages/

          createrepo_c --update rpm-repo

          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$APT_GPG_PASSPHRASE" \
            --local-user "$APT_GPG_KEY_ID" \
            --detach-sign --armor rpm-repo/repodata/repomd.xml

      - name: Push to RPM repository
        if: ${{ steps.publish.outputs.released == 'true' }}
        env:
          NEW_TAG: ${{ steps.plan.outputs.new_tag }}
          REPO_TOKEN: ${{ steps.rpm-token.outputs.token }}
        run: |
          cd rpm-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Add packages from $NEW_TAG" || echo "No changes to commit"
          git push "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/rpm-repo.git" HEAD:main

  attest:
    needs: build
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.build.outputs.released == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.build.outputs.new_tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Attest published artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
