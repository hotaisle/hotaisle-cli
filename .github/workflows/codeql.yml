name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: ruby
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ matrix.language == 'go' }}
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        if: ${{ matrix.language != 'javascript-typescript' }}
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go
        if: ${{ matrix.language == 'go' }}
        run: go build ./...

      - name: Analyze
        if: ${{ matrix.language != 'javascript-typescript' }}
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

      # Keep this existing check name compatible with repository branch rules.
      - name: Verify JavaScript tooling has been removed
        if: ${{ matrix.language == 'javascript-typescript' }}
        run: |
          sources="$(git ls-files -- '*.js' '*.cjs' '*.mjs' '*.jsx' '*.ts' '*.tsx' '*.cts' '*.mts')"
          if [[ -n "$sources" ]]; then
            printf 'JavaScript/TypeScript sources require a configured analyzer:\n%s\n' "$sources" >&2
            exit 1
          fi
